<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pointing Poker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap">
<style>
/* Layout C: Navy AppBar, three independent panes (queue / ticket / comments), one-row sticky bottom bar.
   House-style palette from 07-branding.md and theme.ts. Light only. Target viewport 1280 to 1680px. */
:root {
  --navy: #215470; --night: #0A2138; --night-gray: #4B5563; --amber: #F1A137; --gray200: #E5E7EB;
  --bg: #fff; --paper: #fff;
  --text: #0A2138; --text2: #4B5563; --text-disabled: rgba(10,33,56,.38);
  --divider: #E5E7EB; --input-border: rgba(10,33,56,.23);
  --primary: #215470; --primary-dark: #0A2138; --primary-contrast: #fff;
  --primary-hover: rgba(33,84,112,.06);
  --success: #32522E; --warning: #B14A1B; --error: #C84944;
  --chip-bg: #E5E7EB;
  --disabled-fg: rgba(10,33,56,.3); --disabled-bg: rgba(10,33,56,.12); --disabled-border: rgba(10,33,56,.12);
  --alert-success-bg: #EAF1E8; --alert-success-fg: #1F3320;
  --alert-error-bg: #FBEDEC; --alert-error-fg: #5E1F1C;
  --alert-warning-bg: #FBEEE7; --alert-warning-fg: #5E2A10;
  --mock-bg: #fff8e1; --mock-fg: #5d4300; --mock-border: #c58b00;
  --sh1: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12);
  --sh2: 0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12);
  --sh6: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12);
  --font: Lato, Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
p { margin: 0; }
.ic { width: 24px; height: 24px; fill: currentColor; flex: none; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
a { color: var(--navy); text-decoration: underline; }

/* ---- mock-only chrome ---- */
.mock-strip { position: relative; background: var(--mock-bg); color: var(--mock-fg); border-bottom: 1px dashed var(--mock-border); min-height: 88px; padding: 10px 16px 10px 16px; padding-right: 272px; font-size: 12px; line-height: 1.4; display: flex; align-items: center; }
.mock-strip b { text-transform: uppercase; letter-spacing: .08em; }
.mock { position: absolute; z-index: 20; top: 8px; right: 8px; width: 244px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--mock-bg); color: var(--mock-fg); border: 1px dashed var(--mock-border); border-radius: 4px; box-shadow: var(--sh2); font-size: 12px; }
.mock .tag { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.mock .row { display: flex; gap: 4px; }
.mock select { flex: 1; min-width: 0; height: 28px; background: var(--paper); border: 1px solid var(--mock-border); border-radius: 4px; padding: 0 4px; font-size: 12px; color: var(--text); }
.mock .step { width: 28px; height: 28px; padding: 0; background: var(--paper); color: var(--text); border: 1px solid var(--mock-border); border-radius: 4px; cursor: pointer; }

/* ---- frame ---- */
.frame { min-height: calc(100vh - 88px); display: flex; flex-direction: column; }
#root { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* AppBar */
.appbar { background: var(--navy); color: #fff; }
.toolbar { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; }
.toolbar h1 { flex-grow: 1; margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.5; }
.toolbar .me { font-size: .875rem; }

/* Panes */
.panes { flex: 1; display: grid; grid-template-columns: 25fr 42fr 33fr; gap: 16px; align-items: stretch; padding: 12px 16px; min-width: 0; }
.paper { background: var(--paper); border-radius: 4px; box-shadow: var(--sh1); }
.pane { min-width: 0; max-height: calc(100vh - 64px - 72px - 24px); overflow: auto; padding: 16px; }
.pane > * + * { margin-top: 12px; }
.pane h2.ph { margin: 0 0 4px; font-size: .6875rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text2); line-height: 1.6; }
.muted { color: var(--text2); font-size: .875rem; line-height: 1.43; }
.h6 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
.h6 a { margin-right: 8px; }
.thead { display: flex; align-items: flex-start; gap: 12px; }
.thead .h6 { flex: 1; min-width: 0; }
.btn.open { flex: none; text-decoration: none; gap: 6px; padding: 3px 10px; font-size: .8125rem; }
.btn.open .ic { width: 18px; height: 18px; }
.h5 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.tight { gap: 4px; }

/* Jira-rendered HTML */
.jira { font-size: .875rem; line-height: 1.5; color: var(--text2); overflow-wrap: anywhere; }
.jira > * + * { margin-top: 10px; }
.jira p { margin: 0; }
.jira ul { margin: 0; padding-left: 22px; }
.jira li + li { margin-top: 4px; }
.jira code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8125rem; background: #F3F4F6; border-radius: 3px; padding: 1px 4px; color: var(--night); }
.jira pre { margin: 0; padding: 10px 12px; background: #F3F4F6; border: 1px solid var(--divider); border-radius: 4px; overflow: auto; }
.jira pre code { background: transparent; padding: 0; }
.cm { padding: 12px 0; border-top: 1px solid var(--divider); margin: 0 !important; }
.cm:first-of-type { border-top: 0; padding-top: 0; }
.cm header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 4px; }
.cm .au { font-size: .875rem; font-weight: 700; color: var(--text); }
.cm .dt { font-size: .75rem; color: var(--text2); }

/* Chip */
.chip { display: inline-flex; align-items: center; max-width: 100%; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--chip-bg); color: var(--text); font-size: .8125rem; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.success { background: var(--success); color: #fff; }
.chip.warning { background: var(--warning); color: #fff; }
.chip.sm { height: 20px; padding: 0 7px; font-size: .75rem; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; padding: 7.75px 16px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--navy); font-size: .875rem; font-weight: 500; line-height: 1.75; letter-spacing: 0; text-transform: none; cursor: pointer; white-space: nowrap; }
.btn.outlined { border-color: var(--navy); padding: 6.75px 15px; }
.btn.outlined:hover:not(:disabled) { background: var(--primary-hover); }
.btn.contained { background: var(--navy); color: #fff; box-shadow: var(--sh2); }
.btn.contained:hover:not(:disabled) { background: var(--night); }
.btn.amber { background: var(--amber); color: var(--night); box-shadow: var(--sh2); }
.btn.amber:hover:not(:disabled) { background: #E19A30; }
.btn:disabled { cursor: default; pointer-events: none; color: var(--disabled-fg); }
.btn.outlined:disabled { border-color: var(--disabled-border); }
.btn.contained:disabled, .btn.amber:disabled { background: var(--disabled-bg); box-shadow: none; color: var(--disabled-fg); }
.btn .start { display: inline-flex; margin: 0 8px 0 -4px; }
.spin { width: 16px; height: 16px; animation: rot 1.4s linear infinite; }
.spin circle { fill: none; stroke: currentColor; stroke-width: 3.6; stroke-dasharray: 80px, 200px; stroke-dashoffset: 0; animation: dash 1.4s ease-in-out infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes dash { 0% { stroke-dasharray: 1px, 200px; stroke-dashoffset: 0; } 50% { stroke-dasharray: 100px, 200px; stroke-dashoffset: -15px; } 100% { stroke-dasharray: 100px, 200px; stroke-dashoffset: -125px; } }
@media (prefers-reduced-motion: reduce) { .spin, .spin circle { animation: none; } }
.btn.sm { min-width: 64px; padding: 4px 5px; font-size: .8125rem; line-height: 1.75; }
.btn.outlined.sm { padding: 3px 9px; }

/* TextField / Select (outlined, small) */
.tf { position: relative; }
.tf input, .tf select { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; padding: 8.5px 14px; background: transparent; border: 1px solid var(--input-border); border-radius: 4px; outline: 0; line-height: 1.4375em; }
.tf select { padding-right: 32px; cursor: pointer; }
.tf input:hover:not(:disabled), .tf select:hover:not(:disabled) { border-color: var(--text); }
.tf input:focus, .tf select:focus { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.tf input:disabled, .tf select:disabled { color: var(--text-disabled); border-color: var(--disabled-border); }
.tf input::placeholder { color: transparent; }
.tf input:focus::placeholder { color: var(--text2); }
.tf label { position: absolute; left: 14px; top: 20px; transform: translateY(-50%); transform-origin: left center; color: var(--text2); pointer-events: none; background: var(--paper); padding: 0 5px; margin-left: -5px; line-height: 1.4; transition: transform .15s, top .15s; max-width: calc(100% - 28px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tf input:focus ~ label, .tf input:not(:placeholder-shown) ~ label, .tf select:focus ~ label, .tf.has-value label { top: 0; transform: translateY(-50%) scale(.75); }
.tf input:focus ~ label, .tf select:focus ~ label { color: var(--navy); }
.tf input:disabled ~ label, .tf select:disabled ~ label { color: var(--text-disabled); }
.tf .arrow { position: absolute; right: 7px; top: 8px; color: var(--text2); pointer-events: none; }
.tf select:disabled ~ .arrow { color: var(--disabled-fg); }
.tf.sm select { height: 36px; padding-top: 6px; padding-bottom: 6px; font-size: .875rem; }
.tf.sm label { top: 18px; font-size: .875rem; }
.tf.sm.has-value label { top: 0; }
.tf.sm .arrow { top: 6px; }
.tf.pts { width: 128px; }
.tf.adorn input { padding-left: 40px; }
.tf.adorn .srch { position: absolute; left: 10px; top: 8px; color: var(--text2); pointer-events: none; }
.tf.adorn label { left: 40px; }
.tf.adorn.has-value label, .tf.adorn input:focus ~ label { left: 14px; }

/* Alert */
.alert { display: flex; align-items: flex-start; padding: 6px 16px; border-radius: 4px; font-size: .875rem; line-height: 1.43; }
.alert .ai { padding: 7px 0; margin-right: 12px; display: flex; }
.alert .am { padding: 8px 0; min-width: 0; overflow-wrap: anywhere; flex: 1; }
.alert.success { background: var(--alert-success-bg); color: var(--alert-success-fg); }
.alert.success .ai { color: var(--success); }
.alert.error { background: var(--alert-error-bg); color: var(--alert-error-fg); }
.alert.error .ai { color: var(--error); }
.alert.warning { background: var(--alert-warning-bg); color: var(--alert-warning-fg); }
.alert.warning .ai { color: var(--warning); }
.alert.compact { height: 36px; align-items: center; padding: 0 10px; font-size: .8125rem; max-width: 240px; }
.alert.compact .ai { padding: 0; margin-right: 8px; align-items: center; }
.alert.compact .ic { width: 18px; height: 18px; }
.alert.compact .am { padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Queue panel (left pane) */
.qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.qsel { flex: 1 1 100%; }
.ib { width: 40px; height: 40px; padding: 8px; border: 0; border-radius: 50%; background: transparent; color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ib:hover:not(:disabled) { background: rgba(10,33,56,.05); }
.ib:disabled { color: var(--disabled-fg); cursor: default; }
.qmeta { min-height: 24px; display: flex; align-items: center; font-size: .75rem; line-height: 1.66; color: var(--text2); }
.qmeta .alert { flex: 1; }
.lp { position: relative; overflow: hidden; height: 4px; width: 100%; }
.lp::before { content: ''; position: absolute; inset: 0; background: var(--navy); opacity: .3; }
.lp i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--navy); }
.lp i:nth-child(1) { animation: lp1 2.1s cubic-bezier(.65,.815,.735,.395) infinite; }
.lp i:nth-child(2) { animation: lp2 2.1s cubic-bezier(.165,.84,.44,1) 1.15s infinite; }
@keyframes lp1 { 0% { left: -35%; right: 100%; } 60%, 100% { left: 100%; right: -90%; } }
@keyframes lp2 { 0% { left: -200%; right: 100%; } 60%, 100% { left: 107%; right: -8%; } }
@media (prefers-reduced-motion: reduce) { .lp i { animation: none !important; right: 60%; } }
.ql { list-style: none; margin: 0; padding: 0; border: 1px solid var(--divider); border-radius: 4px; overflow: hidden; }
.qi { display: flex; align-items: center; gap: 12px; padding: 6px 12px; min-height: 48px; }
.qi + .qi { border-top: 1px solid var(--divider); }
.qi.sel { background: rgba(33,84,112,.08); }
.qt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.qp { font-size: .875rem; line-height: 1.43; overflow-wrap: anywhere; }
.qp a { font-weight: 700; margin-right: 6px; }
.qi .btn { flex: none; }
.qempty { font-size: .875rem; color: var(--text2); padding: 8px 0; }
.sres { display: flex; flex-direction: column; gap: 8px; }
.sres:empty { display: none; }

/* Bottom bar */
.bar { position: sticky; bottom: 0; z-index: 10; height: 72px; background: var(--paper); border-top: 3px solid var(--navy); border-radius: 0; box-shadow: 0 -2px 6px rgba(10,33,56,.12); display: flex; align-items: center; gap: 16px; padding: 0 16px; }
.people { flex: 1 1 0; min-width: 0; max-height: 64px; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: center; align-items: center; gap: 4px 6px; }
.pc { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 3px; border: 1px solid var(--divider); border-radius: 14px; font-size: .8125rem; line-height: 1; white-space: nowrap; }
.pc.off { opacity: .45; }
.pc .av { width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; flex: none; }
.pc .ic { width: 18px; height: 18px; }
.pc .vote { font-weight: 700; color: var(--navy); font-size: .875rem; }
.ok { color: var(--success); }
.wait { color: var(--night-gray); }
.stat { font-size: .8125rem; font-weight: 700; margin-left: 6px; white-space: nowrap; }
.deck { flex: none; display: flex; gap: 4px; }
.card { width: 48px; height: 64px; min-width: 0; padding: 0; border: 1px solid var(--navy); border-radius: 4px; background: transparent; color: var(--navy); font-size: 1.25rem; font-weight: 700; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.card:hover:not(:disabled) { background: var(--primary-hover); }
.card.on { background: var(--navy); color: #fff; }
.card.on:hover:not(:disabled) { background: var(--navy); }
.card:disabled { opacity: .35; cursor: default; }
.card.keep:disabled { opacity: 1; }
.acts { flex: none; display: flex; align-items: center; gap: 8px; }

/* Snackbar (above the bottom bar, bottom-center) */
.snackbar { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 88px; display: flex; min-width: 344px; max-width: calc(100vw - 32px); }
.snackbar .alert { flex: 1; background: var(--error); color: #fff; box-shadow: var(--sh6); align-items: center; }
.snackbar .alert .ai { color: #fff; }
.snackbar .x { margin-left: 8px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.snackbar .x:hover { background: rgba(255,255,255,.14); }
.snackbar .x:focus-visible { outline-color: #fff; }
</style>
</head>

  // Search pool: the 6 queue tickets plus 4 more (searchable even if not in the queue).
  var EXTRA = [
    T('PP-111', 'remove legacy geocode page', 'Task', 'Backlog'),
    T('PP-112', 'UI: add share pane to Quick Dashboard reports detail page', 'Task', 'Backlog'),
    T('PP-113', 'UI: Add description field to analysis and dashboard detail pages', 'Task', 'Backlog'),
    T('PP-114', 'UI: add archive button to analysis detail page', 'Task', 'Backlog')
  ];

  // Sample Jira-rendered HTML. Images render as an inline link, the way the real app will.
  function paras(a) { return a.map(function (p) { return '<p>' + p + '</p>'; }).join(''); }
  var DESC = {};
  DESC['PP-101'] =
    '<p>Exporting a report to a Google Sheet currently forces a worksheet resize on every run, even when the grid already matches the data. On large exports this adds a visible delay and can trigger a Sheets API quota error.</p>' +
    '<p>The export should read the current worksheet dimensions first and only call resize when the row or column count differs. Acceptance criteria:</p>' +
    '<ul><li>No resize call is made when the worksheet already has the required rows and columns.</li>' +
    '<li>A worksheet that is too small or too large is still resized before the write.</li>' +
    '<li>The export logs whether a resize was skipped or performed.</li></ul>' +
    '<pre><code>ws = sheet.worksheet(title)\nif (ws.row_count, ws.col_count) != (rows, cols):\n    ws.resize(rows=rows, cols=cols)</code></pre>' +
    '<p>See the <a href="https://developers.google.com/sheets/api/limits" target="_blank" rel="noopener noreferrer">Sheets API usage limits</a> for the quota involved.</p>' +
    '<p>Current behavior: <a href="' + BASE + 'PP-101" target="_blank" rel="noopener noreferrer">[image: worksheet-resize.png]</a></p>';
  DESC['PP-102'] = paras([
    'Today the API accepts any SQL a user submits and relies on the database role to block writes. That works for most clients, but a mistyped DROP or UPDATE is only rejected at execution time, after the job has been queued and a cluster slot has been used.',
    'We want callers to be able to say up front that a query or SQL script must never modify data. A new <code>read_only</code> boolean on the query and SQL script endpoints would do that. It defaults to false so existing integrations do not change.',
    'When <code>read_only</code> is true, the API should parse the statement list before submission and reject anything that is not a SELECT, a WITH that resolves to a SELECT, or an EXPLAIN. Rejection returns a 400 with the offending statement type in the message.',
    'Parsing is the hard part. Multi-statement scripts, comments that hide a keyword, and CTEs that wrap an INSERT all need test cases. We should reuse the existing SQL tokenizer instead of adding a second parser.',
    'The flag also has to reach the worker. The container that runs the statement should open its session with the read-only transaction setting, so a statement that slips past the parser is still refused by the database.',
    'The Python and R clients, and the MCP tools that wrap these endpoints, will need the new parameter exposed. Client changes can ship after the API, since omitting the parameter keeps today\'s behavior.',
    'Audit logging should record the flag value on every submission so we can see how many callers adopt it. No new dashboard is needed for the first release, a log field is enough.',
    'Out of scope: per-user or per-database default policies, and any change to how existing saved scripts are run. Those can be follow-up tickets once we see how the parameter is used.'
  ]);
  function C(a, d, b) { return { author: a, date: d, body: b }; }
  var COMMENTS = {};
  COMMENTS['PP-101'] = [
    C('Carol', 'Oct 3, 2026 2:14 PM', '<p>Reproduced on a 40k row export. Two things I noticed:</p><ul><li>the resize call runs even when rows and columns already match</li><li>the second run is slower than the first</li></ul>'),
    C('Bob', 'Oct 5, 2026 9:40 AM', '<p>The resize happens in <code>export_to_sheet</code> before the write. We can compare <code>ws.row_count</code> first.</p>'),
    C('Dan', 'Oct 6, 2026 11:05 AM', '<p>Happy to review the PR when it is up.</p>')
  ];
  COMMENTS['PP-102'] = [
    C('Eve', 'Oct 1, 2026 10:22 AM', '<p>Do we want 400 or 422 for a rejected statement? Other validation errors in this API use 400.</p>'),
    C('Bob', 'Oct 1, 2026 1:48 PM', '<p>400 is consistent. I would keep the message format the same as the table-reference errors.</p>'),
    C('Carol', 'Oct 2, 2026 3:05 PM', '<p>The tokenizer does not handle dollar-quoted strings yet. Those need a test before we trust it for this.</p>'),
    C('Dan', 'Oct 6, 2026 9:12 AM', '<p>Setting <code>default_transaction_read_only</code> on the session is a cheap second layer. I can confirm it works on our warehouse driver.</p>'),
    C('Alice', 'Oct 7, 2026 4:30 PM', '<p>Confirmed with the data platform team that nobody depends on write statements through the query endpoint.</p>'),
    C('Eve', 'Oct 9, 2026 11:56 AM', '<p>Good. Moving this to the pointing queue.</p>')
  ];

  var PROJECTS = [['PP', 'PP - Pointing Poker'], ['DS', 'DS - Data Science'], ['OPS', 'OPS - Operations']];
  var BOARDS = [['all', 'All (no board)'], ['sprint', 'Platform Sprint Board'], ['kanban', 'Platform Kanban']];
  var QERR = 'Jira: bad_credentials: check the JIRA_API_TOKEN credential';
  var QFORCE = { 'queue-loading': 'loading', 'queue-empty': 'empty', 'queue-error': 'error' };
  var TICKET = QUEUE[0];
  var NAMES = ['Alice', 'Bob', 'Carol', 'Dan', 'Eve'];
  var ERR = "Jira: field_not_editable: Field 'Story Points' cannot be set";
  var STATES = [
    ['idle', '1. idle', 'No ticket loaded, deck disabled.'],
    ['voting-empty', '2. voting-empty', 'Ticket loaded, nobody has voted.'],
    ['voting-partial', '3. voting-partial', 'Alice voted 5 (click a card to change). Dan is offline.'],
    ['revealed', '4. revealed', 'Votes 5, 8, 5, 3, 5. Average 5.2.'],
    ['saving', '5. saving', 'Save to Jira in flight.'],
    ['saved', '6. saved', 'Saved. Next ticket is the way forward.'],
    ['error', '7. error', 'Jira rejected the save. Alert plus snackbar.'],
    ['disconnected', '8. disconnected', 'Socket dropped. All controls disabled, queue included.'],
    ['queue-loading', '9. queue-loading', 'No ticket loaded. Queue is fetching (indeterminate bar).'],
    ['queue-empty', '10. queue-empty', 'No ticket loaded. Queue has no unpointed tickets.'],
    ['queue-error', '11. queue-error', 'No ticket loaded. Queue fetch failed (Jira credential warning).']
  ];
  var cur = 'idle', aliceVote = null, pts = '', tkValue = '', ticketless = false, timer = null, snackOpen = false;
  var project = 'PP', board = 'all', sq = '', sLoad = false, sTimer = null;
  var qLoad = false, qForce = null, qTimer = null, done = [];
  var root = document.getElementById('root');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function icon(id, cls, label) { return '<svg class="ic ' + (cls || '') + '" role="img" aria-label="' + label + '"><use href="#' + id + '"/></svg>'; }

  function phaseOf(s) {
    if (s === 'idle' || QFORCE[s]) return 'idle';
    if (s === 'voting-empty' || s === 'voting-partial' || s === 'disconnected') return 'voting';
    return 'revealed';
  }

  function view() {
    var phase = phaseOf(cur), revealed = phase === 'revealed';
    var partial = cur === 'voting-partial' || cur === 'disconnected';
    var votes = ['5', '8', '5', '3', '5'];
    var players = NAMES.map(function (n, i) {
      var p = { id: i + 1, name: n, connected: true, hasVoted: false, vote: null };
      if (revealed) { p.hasVoted = true; p.vote = votes[i]; }
      else if (i === 0) p.hasVoted = aliceVote !== null;
      else if (partial && (n === 'Bob' || n === 'Eve')) p.hasVoted = true;
      if (partial && n === 'Dan') p.connected = false;
      return p;
    });
    var stats = revealed ? { average: 5.2, counts: { '3': 1, '5': 3, '8': 1 } } : null;
    var jira = { status: 'idle' };
    if (cur === 'saving') jira = { status: 'saving' };
    if (cur === 'saved') jira = { status: 'saved', points: pts || 5, by: 'Alice' };
    if (cur === 'error') jira = { status: 'error', message: ERR };
    return { phase: phase, players: players, stats: stats, jira: jira, connected: cur !== 'disconnected', ticket: ticketless ? null : (phase === 'idle' ? null : TICKET), selected: revealed ? '5' : aliceVote };
  }

  function topBar(v) {
    return '<header class="appbar"><div class="toolbar"><h1>Pointing Poker</h1>' +
      '<span class="chip ' + (v.connected ? 'success' : 'warning') + '">' + (v.connected ? 'Connected' : 'Reconnecting…') + '</span>' +
      '<span class="me">You are Alice</span></div></header>';
  }

  function qList() { return QUEUE.concat(MORE).filter(function (t) { return done.indexOf(t.key) < 0; }); }
  function qMode() {
    if (qLoad) return 'loading';
    if (qForce) return qForce;
    if (project !== 'PP') return 'empty';
    return qList().length ? 'ok' : 'empty';
  }
  function selectField(id, label, opts, val, dis) {
    return '<div class="tf qsel has-value"><select id="' + id + '" data-fid="' + id + '"' + dis + '>' + opts.map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select><label for="' + id + '">' + label + '</label><svg class="ic arrow" aria-hidden="true"><use href="#i-dd"/></svg></div>';
  }

  // LEFT pane: queue
  function queuePanel(v) {
    var off = !v.connected, dis = off ? ' disabled' : '';
    var mode = qMode(), list = mode === 'ok' ? qList() : [];
    var meta = '';
    if (mode === 'loading') meta = '<div class="lp" role="progressbar" aria-label="Loading queue"><i></i><i></i></div>';
    else if (mode === 'error') meta = '<div class="alert warning" role="alert"><span class="ai"><svg class="ic" aria-hidden="true"><use href="#i-warn"/></svg></span><span class="am">' + esc(QERR) + '</span></div>';
    else meta = list.length + (list.length === 1 ? ' ticket' : ' tickets') + ' · updated 2:14 PM';
    var body = '';
    if (mode === 'ok') body = qRows(list, v, 'Unpointed tickets');
    else if (mode === 'empty') body = '<p class="qempty">No unpointed tickets. Change the project or board, or refresh.</p>';
    return '<section class="paper pane" aria-label="Ticket queue"><div class="qrow">' +
      selectField('q-project', 'Project', PROJECTS, project, dis) + selectField('q-board', 'Board', BOARDS, board, dis) +
      '<button type="button" class="ib" data-act="refresh" data-fid="refresh" aria-label="Refresh queue" title="Refresh queue"' + dis + '><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>' +
      '<div class="qmeta">' + meta + '</div>' + body +
      '<div class="tf adorn has-value"><svg class="ic srch" aria-hidden="true"><use href="#i-search"/></svg><input id="q-search" data-fid="q-search" type="text" placeholder="PP-123 or words" autocomplete="off" value="' + esc(sq) + '"' + dis + '><label for="q-search">Search tickets (key or text)</label></div>' +
      '<div id="q-sres" class="sres">' + searchBody(v) + '</div></section>';
  }

  function qRows(list, v, label) {
    var off = !v.connected;
    return '<ul class="ql" aria-label="' + label + '">' + list.map(function (t) {
      var isCur = !!v.ticket && v.ticket.key === t.key;
      return '<li class="qi' + (isCur ? ' sel' : '') + '"><div class="qt"><div class="qp"><a href="' + t.url + '" target="_blank" rel="noopener noreferrer">' + t.key + '</a>' + esc(t.summary) + '</div>' +
        '<div class="chips tight"><span class="chip sm">' + t.issueType + '</span><span class="chip sm">' + t.status + '</span></div></div>' +
        '<button type="button" class="btn outlined sm" data-act="point" data-key="' + t.key + '" data-fid="pt-' + t.key + '"' + ((isCur || off) ? ' disabled' : '') + '>' + (isCur ? 'Current' : 'Point this') + '</button></li>';
    }).join('') + '</ul>';
  }

  // Search results area: updated in place while typing so the input keeps focus and caret.
  function searchBody(v) {
    var q = sq.trim().toLowerCase();
    if (q.length < 2) return '';
    if (sLoad) return '<div class="lp" role="progressbar" aria-label="Searching"><i></i><i></i></div>';
    var hits = QUEUE.concat(EXTRA).filter(function (t) { return t.key.toLowerCase().indexOf(q) >= 0 || t.summary.toLowerCase().indexOf(q) >= 0; });
    return hits.length ? qRows(hits, v, 'Search results') : '<p class="qempty">No matches</p>';
  }
  function paintSearch() { var el = document.getElementById('q-sres'); if (el) el.innerHTML = searchBody(view()); }

  // CENTER pane: ticket
  function ticketPane(v) {
    if (!v.ticket) return '<section class="paper pane" aria-label="Ticket"><h2 class="ph">Ticket</h2><p class="muted">Pick a ticket from the queue or search to start pointing.</p></section>';
    var t = v.ticket;
    var desc = DESC[t.key] || '<p>No description provided.</p>';
    return '<section class="paper pane" aria-label="Ticket"><div class="thead"><h2 class="h6"><a href="' + t.url + '" target="_blank" rel="noopener noreferrer">' + t.key + '</a>' + esc(t.summary) + '</h2>' +
      '<a class="btn outlined open" href="' + t.url + '" target="_blank" rel="noopener noreferrer"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg>Open in Jira</a></div>' +
      '<div class="chips"><span class="chip">' + t.issueType + '</span><span class="chip">' + t.status + '</span><span class="chip">Priority: ' + t.priority + '</span><span class="chip">Assignee: ' + t.assignee + '</span>' +
      t.labels.map(function (l) { return '<span class="chip">' + esc(l) + '</span>'; }).join('') +
      '<span class="chip">Current: ' + (t.currentPoints == null ? 'unset' : t.currentPoints) + ' pts</span></div>' +
      '<h3 class="h5">Description</h3><div class="jira">' + desc + '</div></section>';
  }

  // RIGHT pane: comments, oldest first
  function commentsPane(v) {
    if (!v.ticket) return '<section class="paper pane" aria-label="Comments"><h2 class="h6">Comments</h2><p class="muted">No ticket selected.</p></section>';
    var list = COMMENTS[v.ticket.key] || [];
    return '<section class="paper pane" aria-label="Comments"><h2 class="h6">Comments (' + list.length + ')</h2>' +
      (list.length ? list.map(function (c) {
        return '<article class="cm"><header><span class="au">' + esc(c.author) + '</span><span class="dt">' + c.date + '</span></header><div class="jira">' + c.body + '</div></article>';
      }).join('') : '<p class="muted">No comments</p>') + '</section>';
  }

  function loadTicket(key) {
    var found = QUEUE.concat(MORE, EXTRA).filter(function (t) { return t.key === key; })[0];
    TICKET = found || T(key, 'Loaded by key (not in the sample data)', 'Task', 'Backlog');
    tkValue = key; sq = '';
    go('voting-empty', { keepValue: true });
  }

  function queueLoad() {
    clearTimeout(qTimer);
    qLoad = true; qForce = null;
    render();
    qTimer = setTimeout(function () { qLoad = false; render(); }, 600);
  }

  // BOTTOM bar zone 1: participants, then stats once revealed
  function people(v) {
    var out = v.players.map(function (p) {
      var status = v.phase === 'revealed' ? '<span class="vote">' + (p.vote == null ? '–' : p.vote) + '</span>'
        : p.hasVoted ? icon('i-check', 'ok', 'voted') : icon('i-dots', 'wait', 'not voted');
      return '<span class="pc' + (p.connected ? '' : ' off') + '" title="' + p.name + (p.id === 1 ? ' (you)' : '') + (p.connected ? '' : ', offline') + '"><span class="av" aria-hidden="true">' + p.name.charAt(0).toUpperCase() + '</span>' +
        p.name + status + '</span>';
    }).join('');
    if (v.phase === 'revealed' && v.stats) {
      var keys = Object.keys(v.stats.counts);
      out += '<span class="stat">Avg ' + v.stats.average + '</span>' +
        keys.map(function (k) { return '<span class="chip sm">' + k + ' ×' + v.stats.counts[k] + '</span>'; }).join('') +
        (keys.length === 1 ? '<span class="chip sm success">Consensus</span>' : '<span class="chip sm">No consensus</span>');
    }
    return '<div class="people" role="group" aria-label="Participants">' + out + '</div>';
  }

  // BOTTOM bar zone 2: deck
  function deck(v) {
    var off = !v.connected || v.phase !== 'voting';
    return '<div class="deck" role="group" aria-label="Voting cards">' + CARDS.map(function (c) {
      var sel = c === v.selected;
      var cls = 'card' + (sel ? ' on' : '') + (sel && v.phase === 'revealed' ? ' keep' : '');
      return '<button type="button" class="' + cls + '" data-card="' + c + '" data-fid="card-' + c + '" aria-pressed="' + sel + '"' + (off ? ' disabled' : '') + '>' + c + '</button>';
    }).join('') + '</div>';
  }

  // BOTTOM bar zone 3: actions
  function actions(v) {
    var off = !v.connected, saving = v.jira.status === 'saving';
    var html = '';
    if (v.phase === 'idle') {
      html = '<button type="button" class="btn contained" data-act="reset" data-fid="reset"' + (off ? ' disabled' : '') + '>Start round</button>';
    } else if (v.phase === 'voting') {
      html = '<button type="button" class="btn contained" data-act="reveal" data-fid="reveal"' + (off ? ' disabled' : '') + '>Reveal</button>' +
        '<button type="button" class="btn outlined" data-act="reset" data-fid="reset"' + (off ? ' disabled' : '') + '>Reset</button>';
    } else {
      var canSave = v.ticket !== null && pts !== '' && !saving;
      var opts = '<option value="" hidden></option>' + NUMERIC.map(function (c) { return '<option value="' + c + '"' + (c === pts ? ' selected' : '') + '>' + c + '</option>'; }).join('');
      var spin = saving ? '<span class="start"><svg class="spin" viewBox="22 22 44 44" role="progressbar" aria-label="Saving"><circle cx="44" cy="44" r="20.2"/></svg></span>' : '';
      var alert = '';
      if (v.jira.status === 'saved') alert = '<div class="alert compact success" role="status"><span class="ai"><svg class="ic" aria-hidden="true"><use href="#i-ok"/></svg></span><span class="am">Saved ' + v.jira.points + ' pts by ' + v.jira.by + '</span></div>';
      if (v.jira.status === 'error') alert = '<div class="alert compact error" role="alert" title="' + esc(v.jira.message) + '"><span class="ai"><svg class="ic" aria-hidden="true"><use href="#i-err"/></svg></span><span class="am">' + esc(v.jira.message) + '</span></div>';
      // The saved alert already states the points, so the select is hidden then to keep the bar on one row.
      var sel = v.jira.status === 'saved' ? '' :
        '<div class="tf sm pts' + (pts !== '' ? ' has-value' : '') + '"><select id="pts" data-fid="pts"' + (off ? ' disabled' : '') + '>' + opts + '</select><label for="pts">Story points</label><svg class="ic arrow" aria-hidden="true"><use href="#i-dd"/></svg></div>';
      html = alert + sel +
        '<button type="button" class="btn amber" data-act="save" data-fid="save"' + ((off || !canSave) ? ' disabled' : '') + '>' + spin + 'Save to Jira</button>' +
        '<button type="button" class="btn outlined" data-act="reset" data-fid="reset"' + (off ? ' disabled' : '') + '>Next ticket</button>';
    }
    return '<div class="acts" role="group" aria-label="Actions">' + html + '</div>';
  }

  function bottomBar(v) {
    return '<footer class="paper bar" aria-label="Round controls">' + people(v) + deck(v) + actions(v) + '</footer>';
  }

  function render() {
    var v = view();
    var active = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-fid');
    root.innerHTML = topBar(v) + '<main class="panes">' + queuePanel(v) + ticketPane(v) + commentsPane(v) + '</main>' + bottomBar(v);
    if (active) { var el = root.querySelector('[data-fid="' + active + '"]'); if (el && !el.disabled) el.focus(); }
    var note = STATES.filter(function (s) { return s[0] === cur; })[0][2] + (ticketless && cur === 'voting-empty' ? ' Ticket-less round: Save stays disabled.' : '');
    document.getElementById('mock-note').textContent = note;
    document.getElementById('mock-state').value = cur;
    var showSnack = cur === 'error' && snackOpen;
    document.getElementById('snack').hidden = !showSnack;
    document.getElementById('snack-msg').textContent = ERR;
  }

  function go(s, opts) {
    opts = opts || {};
    clearTimeout(timer); clearTimeout(qTimer); clearTimeout(sTimer);
    qLoad = false; sLoad = false;
    // reset = a mock-only jump (switcher, step, deep link): restore the queue controls and sample data.
    if (opts.reset) { TICKET = QUEUE[0]; done = []; project = 'PP'; board = 'all'; sq = ''; }
    if (opts.reset || QFORCE[s]) qForce = QFORCE[s] || null;
    cur = s;
    if (s === 'saved' && done.indexOf(TICKET.key) < 0) done.push(TICKET.key);
    ticketless = !!opts.ticketless;
    aliceVote = (s === 'voting-partial' || s === 'disconnected') ? '5' : null;
    pts = phaseOf(s) === 'revealed' ? (opts.keepPts || '5') : '';
    if (!opts.keepValue) tkValue = phaseOf(s) === 'idle' ? '' : TICKET.key;
    snackOpen = s === 'error';
    try { history.replaceState(null, '', '#' + s); } catch (e) {}
    render();
  }

  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.hasAttribute('data-card')) { var c = b.getAttribute('data-card'); aliceVote = aliceVote === c ? null : c; render(); return; }
    var a = b.getAttribute('data-act');
    var phase = phaseOf(cur);
    if (a === 'point') { loadTicket(b.getAttribute('data-key')); return; }
    if (a === 'refresh') { queueLoad(); return; }
    if (a === 'reveal') go('revealed');
    else if (a === 'reset') {
      if (phase === 'idle') go('voting-empty', { ticketless: true, keepValue: true });
      else if (phase === 'voting') go('voting-empty', { keepValue: true });
      else go('idle', { keepValue: true });
    } else if (a === 'save') {
      var keep = pts;
      go('saving', { keepPts: keep, keepValue: true });
      timer = setTimeout(function () { go('saved', { keepPts: keep, keepValue: true }); }, 1400);
    }
  });
  root.addEventListener('input', function (e) {
    if (e.target.id !== 'q-search') return;
    sq = e.target.value;
    clearTimeout(sTimer);
    if (sq.trim().length < 2) { sLoad = false; paintSearch(); return; }
    sLoad = true; paintSearch();
    sTimer = setTimeout(function () { sLoad = false; paintSearch(); }, 400);
  });
  root.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'q-project') { project = e.target.value; queueLoad(); return; }
    if (id === 'q-board') { board = e.target.value; qForce = null; render(); return; }
    if (id !== 'pts') return;
    pts = e.target.value;
    e.target.parentNode.classList.toggle('has-value', pts !== '');
    render();
  });

  var sel = document.getElementById('mock-state');
  sel.innerHTML = STATES.map(function (s) { return '<option value="' + s[0] + '">' + s[1] + '</option>'; }).join('');
  sel.addEventListener('change', function () { go(sel.value, { reset: true }); });
  function step(d) { var i = STATES.map(function (s) { return s[0]; }).indexOf(cur); go(STATES[(i + d + STATES.length) % STATES.length][0], { reset: true }); }
  document.getElementById('mock-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('mock-next').addEventListener('click', function () { step(1); });
  document.getElementById('snack-x').addEventListener('click', function () { snackOpen = false; document.getElementById('snack').hidden = true; });

  var h = (location.hash || '').slice(1);
  go(STATES.some(function (s) { return s[0] === h; }) ? h : 'idle', { reset: true });
})();
</script>
</body>
</html>
