name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels the older run. For main that also cancels an in-flight
# publish, so the last merge always wins the :latest tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 26 and npm 12 come from mise.toml, the same pins as local development.
      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      # biome ci covers both lint and formatting. The `!cancelled()` condition keeps each gate
      # running after an earlier one fails, so one run reports every problem.
      - name: Lint and format check
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run tsc:check

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      # --omit=dev on purpose: the lint toolchain drags in advisories that never reach a
      # deployed container, and failing the build on those trains people to ignore the gate.
      # This checks what actually ships.
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # prefix= drops the default "sha-" so the tag is the bare short SHA, like the local scripts.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: gabemendoza1/pointing-poker
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      # GitHub-hosted runners are linux/amd64, which is what the hosting platform runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT_HASH_SHORT=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
