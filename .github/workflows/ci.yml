name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels the older run, including an in-flight publish. On main
# that means the last merge always wins the :latest tag; on a branch, the newest push wins the
# branch tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 26 and npm 12 come from mise.toml, the same pins as local development.
      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      # biome ci covers both lint and formatting. The `!cancelled()` condition keeps each gate
      # running after an earlier one fails, so one run reports every problem.
      - name: Lint and format check
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run tsc:check

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      # --omit=dev on purpose: the lint toolchain drags in advisories that never reach a
      # deployed container, and failing the build on those trains people to ignore the gate.
      # This checks what actually ships.
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  publish:
    needs: checks
    # Every branch push publishes, so a branch can be tried on the hosting platform before it
    # merges. Never on pull_request: that keeps the Docker Hub secrets away from fork PRs, and a
    # same-repo PR already gets its image from the branch push. Tag pushes are skipped.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # prefix= drops the default "sha-" so the tag is the bare short SHA, like the local scripts.
      # type=ref,event=branch adds the branch name, sanitized for Docker (build/v1 -> build-v1).
      # The suffixed copy (build-v1-57) is a fixed tag per CI run, since the plain branch tag
      # moves on every push. run_number is the workflow's run counter; a re-run keeps it.
      # :latest is what the platform deploys, so only the default branch may move it; a branch
      # push must never overwrite it. For the same reason a branch literally named "latest" gets
      # no plain branch tag (it would be :latest); its suffixed tag, latest-57, is harmless.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: gabemendoza1/pointing-poker
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch,enable=${{ github.ref_name != 'latest' }}
            type=ref,event=branch,suffix=-${{ github.run_number }}
            type=raw,value=latest,enable={{is_default_branch}}

      # GitHub-hosted runners are linux/amd64, which is what the hosting platform runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT_HASH_SHORT=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
